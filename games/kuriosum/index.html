<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KURIOSUM</title>
<meta name="description" content="Kuriosum – bizarrer Roguelite-Deckbuilder. Zwei Realitäten. Ein Wille. Oder keiner.">
<link href="../vendor/kuriosum-fonts.css" rel="stylesheet">
<style>:root{--V:#b8323c;--G:#9fae3e;--C:#7d9cc4;--M:#d9788a;--bone:#efe6cf;--yel:#ffe14d;--red:#d1262f;--bg:#070405;--dim:#9c8f84;--fs:11px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--bone);font-family:"VT323","Courier New",monospace;font-size:19px;line-height:1.1;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
img{image-rendering:pixelated}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex;animation:fadeIn .3s steps(4)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
h1,h2,h3{font-family:"Pixelify Sans","VT323","Courier New",monospace;font-weight:700;margin:0;letter-spacing:.04em}
button{font:inherit;color:inherit}
/* --- Titel --- */
.logo{font-size:clamp(40px,13.5vw,104px);margin-top:6vh;color:var(--bone);text-shadow:4px 4px 0 var(--V),-2px -2px 0 #000,8px 8px 0 #000;animation:wob 1.6s steps(2) infinite;line-height:1}
@keyframes wob{0%{transform:translate(0,0) rotate(-.6deg)}50%{transform:translate(1px,2px) rotate(.5deg)}}
.tag{color:var(--dim);font-size:19px;margin-top:10px;text-align:center;padding:0 16px}
.tag::before,.panel p::before{content:"* ";color:var(--bone)}
.menu{margin-top:auto;margin-bottom:5vh;display:flex;flex-direction:column;gap:10px;width:min(300px,80vw);background:#000;border:4px solid var(--bone);padding:12px;box-shadow:0 0 0 4px #000}
.foot{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:14px;color:#5c504a}
/* --- Knöpfe (Undertale-Menü) --- */
.btn{position:relative;display:block;background:#000;border:3px solid var(--bone);padding:8px 14px;font-size:21px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-align:center;line-height:1.05}
.btn span{position:relative}
.btn span::before{content:"♥";position:absolute;left:-1.1em;color:var(--red);opacity:0}
.btn:hover,.btn:focus-visible,.btn.g{border-color:var(--yel);color:var(--yel);outline:0}
.btn:hover span::before,.btn:focus-visible span::before,.btn.g span::before{opacity:1}
.btn:active{transform:translate(2px,2px)}
.btn.m{border-color:var(--M);color:var(--M)}
.btn.sm{font-size:17px;padding:5px 10px;white-space:nowrap;border-width:2px}.btn.sm span::before{display:none}
.btn.sq{padding:5px 9px}
.btn.wide{width:100%}
.btn small{display:block;font-size:16px;color:var(--dim);text-transform:none;letter-spacing:0;margin-top:3px;line-height:1.05}
.btn[disabled]{opacity:.35;pointer-events:none}
/* --- Leisten --- */
.bar{width:100%;display:flex;align-items:center;gap:6px;padding:6px 8px;z-index:5;background:linear-gradient(#000,rgba(0,0,0,0))}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border:2px solid var(--bone);background:#000;font-size:17px;white-space:nowrap}
.chip.hp{color:var(--yel);border-color:var(--yel)}.chip.spl{color:var(--C);border-color:var(--C)}
.icons{display:flex;gap:3px;background:none;border:0;padding:0;cursor:pointer}
.icons img{width:24px;height:24px;border:2px solid var(--G);background:#000}.icons img.d{border-color:var(--red)}
/* --- Karten --- */
.card{--c:var(--V);position:relative;width:10em;height:14.4em;font-size:var(--fs);border:.22em solid var(--bone);background:#0b0808;box-shadow:inset 0 0 0 .2em var(--c),.3em .3em 0 rgba(0,0,0,.7);color:var(--bone);overflow:hidden;flex:none}
.wl-V{--c:var(--V)}.wl-G{--c:var(--G)}.wl-C{--c:var(--C)}.wl-X{--c:#8a8078}
.card.back{box-shadow:.3em .3em 0 rgba(0,0,0,.7)}.card.back img{width:100%;height:100%;display:block}
.c-cost{position:absolute;left:.2em;top:.2em;width:2.2em;height:2.2em;background:var(--c);border-right:.2em solid var(--bone);border-bottom:.2em solid var(--bone);display:flex;align-items:center;justify-content:center;z-index:3}
.c-cost b{font:700 1.75em "Pixelify Sans","VT323",monospace;color:#000;line-height:1}
.c-name{margin:.45em .4em 0 2.7em;font:700 .9em/1 "Pixelify Sans","VT323",monospace;height:2.1em;display:flex;align-items:center;overflow-wrap:anywhere;hyphens:auto}
.c-art{margin:.35em .5em 0;height:4.9em;border:.16em solid var(--bone);overflow:hidden;background:#000;position:relative}
.c-art img{width:100%;height:100%;object-fit:cover;display:block}
.c-type{margin:.3em .5em 0;text-align:center;font-size:.95em;line-height:1;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.c-type span::before{content:"— "}.c-type span::after{content:" —"}
.c-text{margin:.3em .5em 0;font-size:1.06em;line-height:.98;text-align:center}
.c-text i{color:var(--M);font-style:normal}.c-text u{color:var(--G);text-decoration:none}.c-text s{color:var(--yel);text-decoration:none}
.card.mut .c-art img{animation:glitch 2.4s steps(1) infinite}
@keyframes glitch{0%,84%{filter:none;transform:none}86%{filter:invert(1);transform:translateX(.3em)}90%{filter:hue-rotate(120deg) saturate(2);transform:translate(-.3em,.2em)}94%{filter:none;transform:scaleY(-1)}98%{transform:none}}
.card.inf .c-art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 85%,var(--G) 0 18%,transparent 19%),radial-gradient(circle at 80% 20%,var(--G) 0 12%,transparent 13%),radial-gradient(circle at 60% 90%,#4d5a1e 0 10%,transparent 11%);opacity:.8;animation:infP 1s steps(2) infinite}
@keyframes infP{50%{transform:scale(1.12) translate(.1em,-.1em)}}
.inf-b{position:absolute;right:.25em;top:.25em;z-index:3;font-size:.95em;color:#000;background:var(--G);padding:0 .35em;border:.12em solid #000}
.card.cant{filter:brightness(.55)}
.card.justMut{animation:mutFlash .6s steps(5)}
@keyframes mutFlash{0%{filter:invert(1);transform:scale(1.2) rotate(5deg)}50%{filter:hue-rotate(140deg);transform:scale(.92) rotate(-4deg)}100%{filter:none}}
/* --- Kampf --- */
#s-combat{align-items:stretch}
#ePanel{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 10px;z-index:4}
#eName{font:700 22px "Pixelify Sans","VT323",monospace;text-shadow:2px 2px 0 #000}
.hbar{width:min(260px,70vw);height:16px;border:2px solid var(--bone);background:#3a0a0e;position:relative}
.hbar i{display:block;height:100%;background:var(--red);transition:width .25s steps(5)}
.hbar span{position:absolute;inset:0;font-size:16px;line-height:11px;text-align:center;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.hbar.p{width:100%;border-color:var(--yel)}.hbar.p i{background:var(--yel)}.hbar.p span{color:#fff}
#eStat{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:22px}
#intent{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center}
#intent em{font-style:normal;color:var(--dim);font-size:16px}
.it{font-size:17px;padding:0 7px;background:#000;border:2px solid;animation:bob 1s steps(2) infinite}
.it.a{color:#ff6b6b;border-color:var(--red)}.it.b{color:var(--C);border-color:var(--C)}.it.i{color:var(--M);border-color:var(--M)}.it.p{color:var(--G);border-color:var(--G)}
@keyframes bob{50%{transform:translateY(-2px)}}
#mid{flex:1;min-height:40px}
#instWrap{padding:0 10px;z-index:4;width:min(100%,720px);align-self:center;cursor:pointer}
#instHead{display:flex;justify-content:space-between;font-size:17px;gap:8px}#instHead b{color:var(--yel);font-weight:400}#instS{text-align:right}
#instBar{height:14px;border:2px solid var(--bone);background:#000;position:relative}
#instFill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--bone) 0 4px,#cfc3a6 4px 8px);transition:width .3s steps(6)}
.crit #instFill{background:repeating-linear-gradient(90deg,var(--red) 0 4px,#7a1218 4px 8px)}
.fractured #instFill{background:repeating-linear-gradient(90deg,#fff 0 4px,var(--red) 4px 8px)}
#instBar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--yel)}
.crit #instBar{animation:critP .4s steps(2) infinite}@keyframes critP{50%{transform:translateX(2px)}}
#res{display:flex;align-items:center;gap:5px;font-size:16px;min-height:18px;margin-top:3px;color:var(--dim)}
#res .gem{width:11px;height:11px;border:2px solid #6a5c58;background:#000}
#res .gem.on{background:var(--rc);border-color:var(--bone)}
#pRow{width:min(100%,720px);align-self:center;display:flex;align-items:center;gap:8px;padding:5px 10px 2px;z-index:6}
#energy{min-width:74px;font-size:26px;line-height:.9;letter-spacing:1px}#energy i{font-style:normal;color:var(--red);text-shadow:2px 2px 0 #000}#energy em{font-style:normal;color:var(--dim);font-size:18px}
#energy::after{content:"Energie";display:block;font-size:14px;color:var(--dim);letter-spacing:0}
#pVit{flex:1;min-width:0}#pSub{font-size:15px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pSub b{color:var(--C);font-weight:400}
#hand{position:relative;height:calc(var(--fs)*15.4);z-index:8}
#hand .card{position:absolute;bottom:.5em;left:0;transition:transform .15s steps(3),left .15s steps(3);transform-origin:50% 100%;cursor:pointer;animation:drawIn .3s steps(5) backwards}
@keyframes drawIn{from{transform:translate(-60vw,8em) rotate(-30deg);opacity:0}}
#hand .card.sel{border-color:var(--yel);z-index:50!important}
#focus{position:absolute;left:0;right:0;top:0;bottom:calc(var(--fs)*15.4);z-index:7;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding-bottom:calc(var(--fs)*2.6);background:rgba(0,0,0,.78)}
.focus #focus{display:flex}
#focusCard .card{cursor:pointer;border-color:var(--yel);animation:pop .15s steps(3)}
@keyframes pop{from{transform:scale(.7) translateY(40px)}}
#focusBtns{display:flex;gap:10px}#focusBtns .btn{min-width:120px}#focusBtns .btn span::before{display:none}
/* --- Effekte --- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.float{position:absolute;font:700 34px "Pixelify Sans","VT323",monospace;text-shadow:3px 3px 0 #000,-1px -1px 0 #000;animation:floatUp .9s steps(9) forwards;transform:translate(-50%,0);white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-64px)}}
#flash{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(160,10,20,.85))}
#flash.go{animation:fl .4s steps(4)}@keyframes fl{0%{opacity:1}100%{opacity:0}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font:700 clamp(30px,10vw,76px) "Pixelify Sans","VT323",monospace;letter-spacing:.08em;color:var(--bone);text-shadow:4px 4px 0 var(--red),8px 8px 0 #000;opacity:0}
#banner.go{animation:ban 1.4s steps(14)}@keyframes ban{0%{opacity:0;transform:scale(2.4)}15%{opacity:1;transform:scale(1)}22%{transform:translate(-8px,3px)}29%{transform:translate(8px,-3px)}36%{transform:none}82%{opacity:1}100%{opacity:0}}
#crackSvg{position:absolute;inset:0;width:100%;height:100%;opacity:0}
#crackSvg.go{animation:crk 1.2s steps(6)}@keyframes crk{0%{opacity:0}10%{opacity:1}70%{opacity:1}100%{opacity:0}}
#crackSvg path{fill:none;stroke:var(--bone);stroke-width:4;stroke-linejoin:miter;stroke-dasharray:1400;stroke-dashoffset:1400}
#crackSvg.go path{animation:dash .45s steps(8) forwards}@keyframes dash{to{stroke-dashoffset:0}}
#toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);width:max-content;max-width:88vw;text-align:left;font-size:19px;line-height:1.05;padding:8px 12px;background:#000;border:3px solid var(--bone);box-shadow:0 0 0 3px #000;opacity:0;transition:opacity .15s steps(2)}
#toast::before{content:"* "}#toast b{color:var(--yel);font-weight:400}
#toast.on{opacity:1}
body.shake #app{animation:shk .3s steps(4)}@keyframes shk{25%{transform:translate(-7px,4px)}50%{transform:translate(6px,-5px)}75%{transform:translate(-4px,-3px)}}
body.fractured #app{animation:fracW 2.4s steps(1) infinite}@keyframes fracW{0%,92%{transform:none;filter:none}94%{transform:translateX(4px) skewX(1.5deg);filter:invert(.12)}97%{transform:translateX(-3px)}}
/* --- Karte der Schichten --- */
#mapScroll{flex:1;width:100%;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
#mapIn{position:relative;width:min(420px,100%);margin:0 auto}
#mapIn svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:3px solid #5c504a;background:#000;padding:0;cursor:default;filter:brightness(.72)}
.node img{width:100%;height:100%;display:block}
.node.av{filter:none;border-color:var(--yel);cursor:pointer;animation:nodeP .8s steps(2) infinite}
@keyframes nodeP{50%{transform:translateY(-4px);box-shadow:0 4px 0 #000}}
.node.done{filter:grayscale(.8) brightness(.75);border-color:var(--bone)}
.node.here::after{content:"♥";position:absolute;left:50%;top:-22px;transform:translateX(-50%);color:var(--red);font-size:22px;text-shadow:2px 2px 0 #000}
.node.boss{width:72px;height:72px;margin:-36px 0 0 -36px;border-color:var(--red);filter:none}
.nlab{position:absolute;font-size:14px;color:var(--dim);transform:translate(-50%,27px);white-space:nowrap;text-transform:uppercase}
/* --- Tafeln --- */
.panel{margin:auto;width:min(600px,94vw);max-height:94%;display:flex;background:#000;border:4px solid var(--bone);box-shadow:0 0 0 4px #000}
.pin{flex:1;overflow-y:auto;padding:14px 10px;text-align:center;-webkit-overflow-scrolling:touch}
.pin h2{font-size:28px;line-height:1;margin-bottom:6px}.pin h2 em{font-style:normal;color:var(--yel)}
.pin p{color:var(--bone);font-size:19px;line-height:1.05;margin:6px 0 12px}.pin p small{color:var(--dim);font-size:16px}
.kick{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--M);margin:6px 0 4px}
.pimg{width:100%;height:110px;object-fit:cover;border:3px solid var(--bone);margin-bottom:10px;display:block}
.choices{display:flex;flex-direction:column;gap:8px;align-items:center}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.cards .card{cursor:pointer;font-size:calc(var(--fs)*1.3)}.cards .card:hover{border-color:var(--yel)}
#modal{position:fixed;inset:0;z-index:80;display:none;background:rgba(0,0,0,.86);padding:10px}
#modal.on{display:flex}
.disrow{display:flex;gap:8px;align-items:center;text-align:left;border:2px solid var(--red);padding:5px 7px;margin:5px 0}.disrow.g{border-color:var(--G)}
.disrow img{width:36px;height:36px;border:2px solid var(--bone);flex:none}.disrow b{font-weight:400;color:var(--yel)}.disrow small{display:block;font-size:16px;color:var(--bone);line-height:1}
.chars{display:flex;gap:6px;justify-content:center;width:100%;padding:0 8px;margin-top:auto;margin-bottom:8px}
.char{flex:1;max-width:190px;border:3px solid #5c504a;background:#000;padding:8px 5px;cursor:pointer;text-align:center}
.char.on{border-color:var(--yel)}.char.on h3{color:var(--yel)}.char.lock{opacity:.5}
.char h3{font-size:17px;line-height:1}.char p{font-size:16px;color:var(--dim);margin:4px 0;line-height:1}.char em{font-style:normal;color:var(--red)}
#charInfo{width:min(560px,94vw);font-size:18px;text-align:center;min-height:60px;padding:6px 10px;line-height:1.05;background:rgba(0,0,0,.75)}#charInfo b{color:var(--yel);font-weight:400}
.ups{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.up{display:flex;align-items:center;gap:8px;border:2px solid #5c504a;padding:6px 8px}
.up b{font-weight:400;font-size:19px}.up b i{font-style:normal;color:var(--C)}.up small{display:block;color:var(--dim);font-size:16px;line-height:1}.up div{flex:1}
.kodex{text-align:left;font-size:18px;line-height:1.08}.kodex h3{font-size:19px;color:var(--yel);margin:12px 0 2px}.kodex b{color:var(--M);font-weight:400}
@media (min-width:760px){:root{--fs:13px}.float{font-size:44px}}
@media (max-height:640px){.logo{margin-top:2vh}}
@media (prefers-reduced-motion:reduce){.logo,.it,.node.av,body.fractured #app,.crit #instBar{animation:none}}
/* --- v2.2: Reiter, Archiv, Erfolge, Effekte --- */
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}
.arch{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.arch.sealed .card{filter:grayscale(.85) brightness(.5)}
.arch.sealed::before{content:"✝";position:absolute;top:30%;left:50%;transform:translateX(-50%);z-index:5;font-size:40px;color:var(--red);text-shadow:3px 3px 0 #000}
.atag{display:flex;flex-direction:column;align-items:center;font-size:15px;color:var(--G);min-height:30px}.atag small{color:var(--dim);font-size:14px}
.up.got{border-color:var(--G)}.up.got b{color:var(--G)}
.chip.tr{color:var(--yel);border-color:var(--yel);cursor:pointer;font-family:inherit}
#pSub i{font-style:normal;color:var(--G)}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:600px}
.char{max-width:none}
.shieldFx{position:absolute;left:50%;bottom:calc(var(--fs)*15.4 + 118px);width:min(72vw,310px);transform:translateX(-50%);pointer-events:none}
.shieldFx canvas{width:100%;display:block;image-rendering:pixelated;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.75))}
.shieldFx.shake canvas{animation:shk .25s steps(3)}
.healFx{position:absolute;left:0;right:0;bottom:calc(var(--fs)*16);display:flex;justify-content:center;gap:18px}
.healFx i{font-style:normal;font-size:30px;color:var(--G);text-shadow:3px 3px 0 #000;animation:hrise .85s steps(8) forwards}.healFx i:nth-child(2){animation-delay:.08s}.healFx i:nth-child(3){animation-delay:.16s}.healFx i:nth-child(4){animation-delay:.04s}
@keyframes hrise{0%{opacity:0;transform:translateY(20px)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.splat{position:absolute;top:0;width:100%;height:100%;animation:splat 1.1s steps(7) forwards}.splat canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
@keyframes splat{0%{opacity:1;transform:scale(.4)}15%{transform:scale(1.06)}60%{opacity:.9}100%{opacity:0;transform:translateY(40px) scaleY(1.15)}}
.claws{position:absolute;inset:6% 4%}.claws svg{width:100%;height:100%}
.claws path{fill:none;stroke:#0a0607;stroke-width:5;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;animation:claw .25s steps(5) forwards,clawout .65s steps(4) forwards}
.claws path+path{animation-delay:.04s,0s}.claws path+path+path{animation-delay:.08s,0s}
.claws svg{filter:drop-shadow(0 0 0 var(--red)) drop-shadow(4px 0 0 var(--red))}
@keyframes claw{to{stroke-dashoffset:0}}@keyframes clawout{0%,60%{opacity:1}100%{opacity:0}}

/* --- leichte Musik-Reaktion (--beat 0..1) --- */
:root{--beat:0}
.logo{scale:calc(1 + var(--beat) * .035)}
#energy i{display:inline-block;scale:calc(1 + var(--beat) * .18)}
.node.here::after{scale:calc(1 + var(--beat) * .3)}
.btn.g{box-shadow:0 0 0 calc(var(--beat) * 3px) rgba(255,225,77,.35)}
@media (prefers-reduced-motion:reduce){.logo,#energy i{scale:1}}

/* --- Wisch-Steuerung --- */
#hand,#focusCard{touch-action:none}
#hand .card.drag,#focusCard .card.drag{transition:none!important;z-index:90!important;box-shadow:.6em .9em 0 rgba(0,0,0,.6);cursor:grabbing}
.card.armed{border-color:var(--yel)!important;box-shadow:0 0 0 .25em var(--yel),.6em .9em 0 rgba(0,0,0,.6)!important}
.card.broke{border-color:var(--red)!important;filter:brightness(.6) saturate(.5)}
#mid{position:relative}
.dragging #mid::after{content:"↑ hochwischen";position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:20px;color:var(--dim);letter-spacing:.1em;animation:bob .6s steps(2) infinite}
.aiming #mid::after{content:"♥ loslassen";color:var(--yel)}
.aiming #eName{color:var(--yel)}.aiming #ePanel .hbar{animation:critP .25s steps(2) infinite}

<script>/* ===== KURIOSUM – Grafik: Fiebertraum-Tinte, Dithering, Sound ===== */
