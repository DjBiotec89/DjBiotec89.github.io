<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#120b20">
<title>SWISS MAYHEM – Zürich Vertical Slice</title>
<style>
:root{--night:#120b20;--deep:#0b0712;--violet:#7656b3;--violet2:#a98cd6;--gold:#e3bc48;--gold2:#f6d66f;--mint:#76d8c5;--paper:#f4efe5;--ink:#171022;--red:#e5383b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--paper);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hidden{display:none!important}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.px{text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000}
#money{position:absolute;left:14px;top:10px;font-size:26px;font-weight:900;color:var(--gold2);letter-spacing:1px}
#bars{position:absolute;left:14px;top:66px;width:170px}
#score{position:absolute;left:14px;top:40px;font-size:15px;font-weight:900;color:#fff}#score i{font-style:normal;color:#f6d66f;margin-left:6px}#score u{text-decoration:none;color:#e5383b;margin-left:8px;letter-spacing:1px}
input.name{font:900 22px ui-monospace,monospace;text-transform:uppercase;padding:8px 12px;width:240px;max-width:70vw;background:#0b0712;color:#f6d66f;border:3px solid #e3bc48;-webkit-user-select:text;user-select:text;text-align:center}
.bar{height:9px;background:#0008;border:2px solid #000;margin-bottom:4px;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:#e5383b;transition:width .15s}
#armor>i{background:#5ab0ff}
#vehbar>i{background:var(--gold)}
#vehname{font-size:11px;color:#fff;margin-top:2px}
#stars{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:26px;letter-spacing:4px;white-space:nowrap}
#stars span{color:#333;text-shadow:0 0 0 #000,2px 2px 0 #000}
#stars span.on{color:var(--gold2)}
#stars.flash span.on{animation:fl .5s steps(2) infinite}
@keyframes fl{50%{color:#5ab0ff}}
#weapon{position:absolute;right:150px;top:10px;text-align:right}
#wname{font-size:15px;font-weight:900;color:#fff}
#wammo{font-size:13px;color:var(--gold2)}
#wicon{font-size:26px;line-height:1}
#minimapWrap{position:absolute;right:12px;top:10px;width:128px;height:128px;border:3px solid #000;border-radius:50%;overflow:hidden;background:#1b2030;box-shadow:0 0 0 2px var(--gold)}
#minimap{width:100%;height:100%}
#mission{position:absolute;left:50%;top:46px;transform:translateX(-50%);font-size:14px;color:#fff;text-align:center;max-width:70vw}
#mission b{color:var(--gold2)}
#timer{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:22px;color:var(--gold2);font-weight:900}
#notify{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;font-weight:900}
#notify .big{font-size:56px;letter-spacing:4px}
#notify .small{font-size:16px;margin-top:6px}
#toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-size:15px;color:#fff;text-align:center;max-width:80vw}
#clock{position:absolute;left:14px;top:118px;font-size:12px;color:#ddd}
#arrow{position:absolute;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:24px solid var(--gold2);filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 2px #000);transform-origin:50% 50%}
#prompt{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);font-size:14px;color:var(--gold2)}
#fps{position:absolute;left:14px;bottom:6px;font-size:10px;color:#888}
/* ---------- Touch ---------- */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
.stick{position:absolute;width:130px;height:130px;border-radius:50%;border:3px solid #fff4;background:#0003;display:none;pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:#fff5;border:3px solid #fff8}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;background:#0006;border:3px solid #fff6;color:#fff;font:900 11px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;text-align:center;width:62px;height:62px}
.tbtn:active,.tbtn.on{background:#e3bc4888;border-color:var(--gold2)}
#bEnter{right:22px;bottom:150px;width:70px;height:70px;font-size:11px}
#bWeapon{right:104px;bottom:200px}
#bAction{right:184px;bottom:200px}
#bPause{right:150px;top:10px;width:38px;height:38px;border-radius:8px;font-size:16px;pointer-events:auto}
.touchmode #weapon{right:200px}
/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:radial-gradient(ellipse at 50% 40%,rgba(42,26,74,.55) 0%,rgba(18,11,32,.82) 60%,rgba(5,3,8,.95) 100%);overflow:auto}
.panel{max-width:760px;width:92%;text-align:center;padding:18px;margin:auto}
.card{touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tcol{min-width:0}
#zone{position:absolute;left:14px;bottom:14px;font-size:26px;font-weight:900;color:#fff;letter-spacing:2px;opacity:0;transition:opacity .5s}
#zone small{display:block;font-size:12px;color:#f6d66f;letter-spacing:1px}
@media (max-height:540px){
  .panel{padding:10px}
  .title-panel{max-width:1000px;display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:center}
  .logo{font-size:44px!important}
  .sub{margin:8px 0 2px;font-size:12px}.tag{font-size:11px;margin-bottom:10px}
  .btn{padding:9px 18px;font-size:14px}
  .help{font-size:11px;line-height:1.45;margin-top:8px;padding:8px 10px}
  #goScore{font-size:32px!important}
  #zone{font-size:20px;bottom:auto;top:150px}
}
.logo{font-size:min(13vw,92px);font-weight:900;line-height:.9;letter-spacing:2px;color:#fff;text-shadow:4px 4px 0 var(--red),8px 8px 0 #000}
.logo .cross{display:inline-block;width:.62em;height:.62em;background:var(--red);position:relative;vertical-align:middle;margin-right:.12em;box-shadow:4px 4px 0 #000}
.logo .cross:before,.logo .cross:after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
.logo .cross:before{width:62%;height:20%}.logo .cross:after{width:20%;height:62%}
.sub{color:var(--gold2);margin:14px 0 4px;font-size:15px;letter-spacing:1px}
.tag{color:var(--violet2);font-size:12px;margin-bottom:22px}
.btn{display:inline-block;pointer-events:auto;cursor:pointer;margin:6px;padding:12px 26px;background:var(--gold);color:var(--ink);font:900 16px ui-monospace,monospace;border:3px solid #000;box-shadow:4px 4px 0 #000;letter-spacing:1px}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.btn.alt{background:var(--violet2)}
.btn.dark{background:#2a2140;color:#fff}
.help{font-size:12px;color:#cfc6e6;line-height:1.6;text-align:left;margin:16px auto 0;max-width:620px;background:#0006;border:2px solid #2a2140;padding:10px 14px}
.help b{color:var(--gold2)}
#rotate{position:fixed;inset:0;z-index:50;background:#120b20;display:none;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:30px}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#000a}
.card{background:#1a1230;border:3px solid var(--gold);box-shadow:6px 6px 0 #000;padding:16px 20px;max-width:520px;width:90%;color:#fff;max-height:90vh;overflow:auto}
.card h2{margin:0 0 8px;color:var(--gold2);font-size:20px}
.card p{font-size:13px;line-height:1.55;color:#ddd}
.shoprow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #fff2;padding:6px 0;font-size:13px}
.shoprow .btn{padding:6px 12px;font-size:12px;margin:0}
</style>

<script src="../vendor/three-r128.min.js"></script>
<script>
(function(){
// ======================================================================
// SWISS MAYHEM – Core: Utils, Input, Audio
// ======================================================================
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const chance = p => Math.random() < p;
const dist2 = (ax, az, bx, bz) => { const dx = ax - bx, dz = az - bz; return dx * dx + dz * dz; };
const dist = (ax, az, bx, bz) => Math.sqrt(dist2(ax, az, bx, bz));
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const fmtCHF = n => 'CHF ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let GAME_TIME = 0; // seconds since start (sim)

// ---------------- Input ----------------
const Input = {
  keys: {}, pressed: {},
  mouse: { x: 0, y: 0, down: false, rdown: false, has: false },
  moveX: 0, moveY: 0,          // screen-space move (-1..1), y up = +1
  aimX: 0, aimY: 0, aimMag: 0, // touch aim stick (screen space)
  fire: false, touchMode: IS_TOUCH,
  btn: { enter: false, weapon: false, action: false, actionHeld: false },
  init() {
    addEventListener('keydown', e => {
      if (e.target && e.target.tagName === 'INPUT') return;
      if (!this.keys[e.code]) this.pressed[e.code] = true;
      this.keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });
    addEventListener('blur', () => { this.keys = {}; this.mouse.down = false; });
    const cv = $('game');
    cv.addEventListener('mousemove', e => { this.mouse.x = e.clientX; this.mouse.y = e.clientY; this.mouse.has = true; if (!this._touchActive) this.touchMode = false; });
    cv.addEventListener('mousedown', e => { if (e.button === 0) this.mouse.down = true; if (e.button === 2) { this.mouse.rdown = true; this.pressed.Mouse2 = true; } this.mouse.has = true; });
    addEventListener('mouseup', e => { if (e.button === 0) this.mouse.down = false; if (e.button === 2) this.mouse.rdown = false; });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    addEventListener('wheel', e => { this.pressed[e.deltaY > 0 ? 'WheelDown' : 'WheelUp'] = true; }, { passive: true });
    this.initTouch();
  },
  initTouch() {
    const L = $('stickL'), R = $('stickR');
    const sticks = { L: null, R: null };
    const btnIds = ['bEnter', 'bWeapon', 'bAction', 'bPause'];
    const self = this;
    function setStick(el, s) {
      if (!s) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      el.style.left = (s.ox - 65) + 'px'; el.style.top = (s.oy - 65) + 'px';
      const k = el.firstElementChild;
      k.style.transform = `translate(${s.dx * 40}px,${s.dy * 40}px)`;
    }
    function upd(s, t) {
      let dx = (t.clientX - s.ox) / 50, dy = (t.clientY - s.oy) / 50;
      const m = Math.hypot(dx, dy);
      if (m > 1) { dx /= m; dy /= m; }
      s.dx = dx; s.dy = dy;
    }
    const onStart = e => {
      if (!self._enabled) return;
      self._touchActive = true; self.touchMode = true;
      for (const t of e.changedTouches) {
        const tgt = t.target;
        if (tgt && tgt.id && btnIds.includes(tgt.id)) continue;
        if (tgt && tgt.closest && (tgt.closest('.modal') || tgt.closest('.screen'))) continue;
        if (t.clientX < innerWidth * 0.45) {
          if (!sticks.L) { sticks.L = { id: t.identifier, ox: t.clientX, oy: t.clientY, dx: 0, dy: 0 }; setStick(L, sticks.L); }
        } else {
          if (!sticks.R) { sticks.R = { id: t.identifier, ox: t.clientX, oy: t.clientY, dx: 0, dy: 0 }; setStick(R, sticks.R); }
        }
      }
      if (e.target === $('game') || e.target === document.body) e.preventDefault();
    };
    const onMove = e => {
      for (const t of e.changedTouches) {
        if (sticks.L && t.identifier === sticks.L.id) { upd(sticks.L, t); setStick(L, sticks.L); }
        if (sticks.R && t.identifier === sticks.R.id) { upd(sticks.R, t); setStick(R, sticks.R); }
      }
      self.syncSticks(sticks);
      const tg = e.target; const inUI = tg && tg.closest && (tg.closest('.card') || tg.closest('.screen'));
      if (!inUI || sticks.L || sticks.R) e.preventDefault();
    };
    const onEnd = e => {
      for (const t of e.changedTouches) {
        if (sticks.L && t.identifier === sticks.L.id) { sticks.L = null; setStick(L, null); }
        if (sticks.R && t.identifier === sticks.R.id) { sticks.R = null; setStick(R, null); }
      }
      self.syncSticks(sticks);
    };
    addEventListener('touchstart', onStart, { passive: false });
    addEventListener('touchmove', onMove, { passive: false });
    addEventListener('touchend', onEnd); addEventListener('touchcancel', onEnd);
    const bind = (id, key) => {
      const el = $(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); self.btn[key] = true; if (key === 'action') self.btn.actionHeld = true; el.classList.add('on'); }, { passive: false });
      const up = e => { self.btn.actionHeld = key === 'action' ? false : self.btn.actionHeld; el.classList.remove('on'); };
      el.addEventListener('touchend', up); el.addEventListener('touchcancel', up);
      el.addEventListener('mousedown', e => { self.btn[key] = true; if (key === 'action') self.btn.actionHeld = true; });
      el.addEventListener('mouseup', up);
    };
    bind('bEnter', 'enter'); bind('bWeapon', 'weapon'); bind('bAction', 'action'); bind('bPause', 'pause');
    this._sticks = sticks;
  },
  syncSticks(s) {
    this.tMoveX = s.L ? s.L.dx : 0; this.tMoveY = s.L ? -s.L.dy : 0;
    this.aimX = s.R ? s.R.dx : 0; this.aimY = s.R ? -s.R.dy : 0;
    this.aimMag = Math.hypot(this.aimX, this.aimY);
  },
  update() {
    const k = this.keys;
    let mx = 0, my = 0;
    if (k.KeyA || k.ArrowLeft) mx -= 1; if (k.KeyD || k.ArrowRight) mx += 1;
    if (k.KeyW || k.ArrowUp) my += 1; if (k.KeyS || k.ArrowDown) my -= 1;
    if (this.tMoveX || this.tMoveY) { mx = this.tMoveX; my = this.tMoveY; }
    this.moveX = mx; this.moveY = my;
  },
  wasPressed(code) { return !!this.pressed[code]; },
  endFrame() { this.pressed = {}; this.btn.enter = false; this.btn.weapon = false; this.btn.action = false; this.btn.pause = false; }
};

// ---------------- Audio (synthesized) ----------------
const Sfx = {
  ctx: null, master: null, on: true, noiseBuf: null, siren: null, engine: null, radio: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 1.0;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // siren
      const so = this.ctx.createOscillator(); so.type = 'square';
      const sg = this.ctx.createGain(); sg.gain.value = 0;
      const sf = this.ctx.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 1800;
      so.connect(sf); sf.connect(sg); sg.connect(this.master); so.start();
      this.siren = { o: so, g: sg };
      // engine
      const eo = this.ctx.createOscillator(); eo.type = 'sawtooth';
      const eg = this.ctx.createGain(); eg.gain.value = 0;
      const ef = this.ctx.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 400;
      eo.connect(ef); ef.connect(eg); eg.connect(this.master); eo.start();
      this.engine = { o: eo, g: eg, f: ef };
      Radio.init(this);
    } catch (e) { this.ctx = null; }
  },
  setOn(v) { this.on = v; if (this.master) this.master.gain.value = v ? 0.55 : 0; },
  noise(t0, dur, vol, f0, f1, type = 'lowpass', q = 1) {
    const c = this.ctx; if (!c || !this.on) return;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  },
  tone(t0, dur, vol, f0, f1, type = 'square') {
    const c = this.ctx; if (!c || !this.on) return;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);

const Roads = {
  nodes: [], // {i,j,x,z,nb:[idx]}
  idx(i, j) { return j * 8 + i; },
  build() {
    for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) this.nodes.push({ i, j, x: W.c(i), z: W.c(j), nb: [] });
    for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) {
      const n = this.nodes[this.idx(i, j)];

    }
  },
  nearest(x, z) { const i = clamp(Math.round(x / W.P), 0, 7), j = clamp(Math.round(z / W.P), 0, 7); return this.idx(i, j); },
  // BFS path

class ParticleSys {
  constructor(scene, cap, additive) {
    this.cap = cap; this.n = 0;
    this.pos = new Float32Array(cap * 3); this.col = new Float32Array(cap * 4); this.size = new Float32Array(cap);
    this.p = []; // particle data
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('col', new THREE.BufferAttribute(this.col, 4).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('size', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: 10 } },
      vertexShader: `attribute float size; attribute vec4 col; varying vec4 vCol; uniform float uScale;
        void main(){ vCol=col; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; gl_PointSize=max(1.0,size*uScale); }`,
      fragmentShader: `varying vec4 vCol; void main(){
        if(vCol.a<0.01) discard;
        float d = length(gl_PointCoord - 0.5) * 2.0; if (d > 1.0) discard;
        float a = vCol.a * (1.0 - smoothstep(0.35, 1.0, d));
        gl_FragColor = vec4(vCol.rgb, a); }`,
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.pts = new THREE.Points(g, this.mat); this.pts.frustumCulled = false; this.pts.renderOrder = additive ? 3 : 2;
    scene.add(this.pts); this.geo = g;
  }
  emit(o) {
    if (this.p.length >= this.cap) this.p.shift();
    this.p.push({
      x: o.x, y: o.y, z: o.z, vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0,
      life: 0, max: o.life || 1, s0: o.size || 0.3, s1: o.size1 !== undefined ? o.size1 : (o.size || 0.3),
      c0: o.c0 || [1, 1, 1, 1], c1: o.c1 || o.c0 || [1, 1, 1, 0], g: o.g || 0, drag: o.drag || 0, floor: o.floor !== undefined ? o.floor : 0.05,
    });
  }
  update(dt) {
    const P = this.p; let w = 0;
    for (let i = 0; i < P.length; i++) {
      const p = P[i]; p.life += dt; if (p.life >= p.max) continue;
      p.vy -= p.g * dt; const dr = Math.max(0, 1 - p.drag * dt); p.vx *= dr; p.vy *= dr; p.vz *= dr;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.y < p.floor) { p.y = p.floor; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; }
      P[w++] = p;
    }
    P.length = w;
    for (let i = 0; i < w; i++) {
      const p = P[i], t = p.life / p.max;
      this.pos[i * 3] = p.x; this.pos[i * 3 + 1] = p.y; this.pos[i * 3 + 2] = p.z;
      for (let k = 0; k < 4; k++) this.col[i * 4 + k] = p.c0[k] + (p.c1[k] - p.c0[k]) * t;
      this.size[i] = p.s0 + (p.s1 - p.s0) * t;
    }
    this.geo.setDrawRange(0, w);
    if (w === 0 && this._lastW === 0) return; this._lastW = w;
    const A = this.geo.attributes, n = Math.max(1, w);
    A.position.updateRange.count = n * 3; A.col.updateRange.count = n * 4; A.size.updateRange.count = n;
    A.position.needsUpdate = true; A.col.needsUpdate = true; A.size.needsUpdate = true;
  }
}

const Sky = {
  tod: 17.0, speed: 1 / 30, // game hours per real second
  night: 0,
  init(scene) {

    this.sun = new THREE.DirectionalLight(0xffffff, 0.9);

  update(dt, cx, cz) {

    const az = (t - 6) / 12 * Math.PI;

    this.sun.target.position.set(cx, 0, cz);

    const C = this._c || (this._c = { w: new THREE.Color(0xffffff), o: new THREE.Color(0xff9a50), n: new THREE.Color(0x8090d0), d: new THREE.Color(0xcfe4ff), bg0: new THREE.Color(0x9fb8d0), bgd: new THREE.Color(0xe0a080), bgn: new THREE.Color(0x1e2444), gr: new THREE.Color(0x8c9ab0), t1: new THREE.Color(), t2: new THREE.Color() });

  str() { const h = Math.floor(this.tod), m = Math.floor((this.tod - h) * 60); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }
};

  ok: false,

// World Event Engine – central bus connecting all systems
// ======================================================================
const EventBus = {
  queue: [], recent: [], subs: [], nextId: 1, budget: 48, stats: { emitted: 0, merged: 0, dropped: 0, processed: 0 },
  PRIO: { POLICE_ALERT: 6, EXPLOSION: 5, CRIME: 5, GUNSHOT: 4, VEHICLE_DESTROYED: 4, FIRE_STARTED: 3, NPC_INJURED: 3, NPC_DEAD: 3, VEHICLE_COLLISION: 2, PROPERTY_DAMAGED: 1, NPC_FLEEING: 1 },
  MAX_DEPTH: 4,
  // o: {radius, intensity, source, depth, data}
  emit(type, x, z, o = {}) {
    const depth = o.depth || 0;
    if (depth > this.MAX_DEPTH) { this.stats.dropped++; return null; }
    const radius = o.radius || 20;
    // duplicate suppression: same type + same source nearby within short window
    const win = type === 'GUNSHOT' ? 0.25 : 0.6;
    for (const r of this.recent) {
      if (r.type === type && r.source === o.source && (type !== 'CRIME' || (r.data && o.data && r.data.kind === o.data.kind)) && GAME_TIME - r.time < win && dist2(r.x, r.z, x, z) < (radius * 0.35) ** 2) {
        r.intensity = Math.max(r.intensity, o.intensity || 1); this.stats.merged++; return r;
      }
    }
    for (const q of this.queue) {
      if (q.type === type && q.source === o.source && (type !== 'CRIME' || (q.data && o.data && q.data.kind === o.data.kind)) && dist2(q.x, q.z, x, z) < (radius * 0.35) ** 2) { q.intensity = Math.max(q.intensity, o.intensity || 1); this.stats.merged++; return q; }
    }
    const e = { id: this.nextId++, type, x, z, radius, intensity: o.intensity || 1, source: o.source || null, time: GAME_TIME, depth, data: o.data || null, prio: this.PRIO[type] || 1 };
    this.queue.push(e); this.stats.emitted++;
    if (this.queue.length > 200) { this.queue.sort((a, b) => b.prio - a.prio); this.stats.dropped += this.queue.length - 200; this.queue.length = 200; }
    return e;
  },
  // subscriber: {name, types:Set|null, fn(e)}
  on(name, types, fn) { this.subs.push({ name, types: types ? new Set(types) : null, fn }); },
  update() {
    if (!this.queue.length) { this.prune(); return; }
    this.queue.sort((a, b) => b.prio - a.prio);
    const n = Math.min(this.budget, this.queue.length);
    const batch = this.queue.splice(0, n);
    for (const e of batch) {
      for (const s of this.subs) if (!s.types || s.types.has(e.type)) s.fn(e);
      this.recent.push(e); this.stats.processed++;
    }
    this.prune();
  },
  prune() { if (this.recent.length > 120) this.recent.splice(0, this.recent.length - 120); const t = GAME_TIME; while (this.recent.length && t - this.recent[0].time > 2) this.recent.shift(); },
  reset() { this.queue.length = 0; this.recent.length = 0; }
};

// ---------------- Civilian AI ----------------
const CivAI = {
  init(p) { p.node = Walk.nearest(p.x, p.z); p.prevNode = -1; p.walkSpeed = rand(1.2, 1.7); p.ai = this; p.threatX = 0; p.threatZ = 0; p.panicFrom = (x, z, lvl) => CivAI.panic(p, x, z, lvl); },
  update(p, dt) {

        p.steer(dx / d + Math.sin(p.id + GAME_TIME) * 0.3, dz / d + Math.cos(p.id + GAME_TIME) * 0.3, p.hp < p.maxHp * 0.4 ? 1.8 : 4.6, dt);
        if (p.stateT > 1 && chance(dt * 0.5)) EventBus.emit('NPC_FLEEING', p.x, p.z, { radius: 9, source: p, depth: (p.panicDepth || 0) + 1 });
        if (p.stateT > p.fleeT) {

        break;

        if (d > 1.3) p.steer(tx - p.x, tz - p.z, 4.2, dt);

  calm(p) { p.setState('normal'); p.node = Walk.nearest(p.x, p.z); p.prevNode = -1; },
  dodgeCars(p, dt) {

  panic(p, x, z, lvl, depth = 0) {

          if (p.personality === 'brave' && d < 10 && !P.vehicle && (victimIsMe || e.data.kind === 'assault') && (!P.weapon || WEAPONS[P.weapon].melee)) { p.setState('defensive'); p.target = P; break; }
          // witness?

            p.wantsReport = p.hasPhone && !p.reported; p.reportX = P.vehicle ? P.vehicle.x : P.x; p.reportZ = P.vehicle ? P.vehicle.z : P.z;

        }

// ---------------- Lane following (shared by traffic/police/services) ----------------
const Lane = {
  start(v, from, to) { v.nav = { from, to, path: null }; },

  nextNode(v) {

  // compute steer/throttle along lanes; returns distance to current target node
  drive(v, dt, opt) {

    let dx = B.x - A.x, dz = B.z - A.z; const L = Math.hypot(dx, dz) || 1; dx /= L; dz /= L;

  },

  obstacle(v, ignoreTarget) {

    return lim;
  }

// ---------------- Traffic AI ----------------
const TrafficAI = {
  init(v) { v.ai = this; v.mood = rand(0.8, 1.15); v.panicT = 0; v.stuckT = 0; v.revT = 0; },
  update(v, dt) {

    if (v.dstate === 'CRITICAL' && v.driver !== Game.player) { const d = v.driver; exitVehicle(d); d.ai = CivAI; CivAI.init(d); CivAI.panic(d, v.x, v.z, 2); v.ai = null; v.throttle = 0; return; }

  },
  onEvent(e) {

      if (v.ai !== TrafficAI || !v.driver) continue;
      if (dist2(v.x, v.z, e.x, e.z) < (e.type === 'EXPLOSION' ? 30 : 20) ** 2) { v.panicT = rand(6, 10); if (chance(0.3)) Sfx.play('horn', v.distToCam()); }
    }
  }

// ---------------- Police ----------------
const LEVEL_HEAT = [0, 1, 4, 9, 16, 26];

  heat: 0, level: 0, knownX: 0, knownZ: 0, knownVeh: null, seen: false, unseenT: 0, dispatchT: 0, rbT: 10, heli: null, heliT: 0, lastLevel: 0, everSeen: false,

    else { this.knownX = x + rand(-6, 6); this.knownZ = z + rand(-6, 6); if (this.level > 0) this.unseenT = Math.min(this.unseenT, 3); }

  },
  onCrime(e) {

    let witnessed = false;

      const x = p.vehicle ? p.vehicle.x : p.x, z = p.vehicle ? p.vehicle.z : p.z;

  cops() { return World.peds.filter(p => (p.kind === 'cop' || p.kind === 'swat') && p.alive); },

const PoliceCarAI = {
  init(v, from, to) { v.ai = this; v.mode = 'respond'; Lane.start(v, from, to); v.stuckT = 0; v.revT = 0; v.deployT = 0; v.isPolice = true; },
  update(v, dt) {

class Tram {
  constructor(s, scene) {

    this.v = new Vehicle('tram', 0, 0, 0, scene); // tram handled separately (not in World.vehicles)

    for (let i = 0; i < 4; i++) { const a = this.loop[i], b = this.loop[(i + 1) % 4]; const L = dist(a[0], a[1], b[0], b[1]); this.segs.push({ a, b, L, s0: this.len }); this.len += L; }

      for (const v of World.vehicles) if (dist2(v.x, v.z, p.x, p.z) < 6) { block = true; break; }

    }

  // ---------------- main loop ----------------
  frame(t) {
    requestAnimationFrame(tt => this.frame(tt));
    let raw = Math.min(0.05, Math.max(0.001, (t - this.last) / 1000)); this.last = t;
    // smooth out frame-time jitter (vsync hiccups) for steadier motion
    this.dtS = this.dtS ? (Math.abs(raw - this.dtS) > 0.02 ? raw : this.dtS * 0.8 + raw * 0.2) : raw;
    let dt = this.dtS;
    this.fpsAcc = (this.fpsAcc || 0) * 0.95 + dt * 0.05;
    if (Input.btn.pause) { this.setPause(!this.paused); }
    if (!this.running) { if (!this._idleCam) { this._idleCam = true; } this.idleTitle(dt); Input.endFrame(); return; }
    if (this.paused || Shop.open) { Input.endFrame(); this.draw(); return; }
    GAME_TIME += dt; this.stats.time += dt;
    Input.update();
    this.updatePlayer(dt);
    const P = this.player;
    // AI
    for (const p of World.peds) {
      if (p === P) continue;
      if (!p.alive) { p.deadT = (p.deadT || 0) + dt; if (p.burnT > 0) { p.burnT -= dt; if (chance(dt * 20)) FX.flame(p.x, 0.4, p.z, 0.6); } continue; }
      if (p.ai) p.ai.update(p, dt);
    }
    for (const v of World.vehicles) if (v.ai && v !== P.vehicle) v.ai.update(v, dt);
    // physics (sub-stepped for vehicles)
    const steps = dt > 0.025 ? 2 : 1;
    for (let s = 0; s < steps; s++) { for (const v of World.vehicles) v.physics(dt / steps); Population.collide(dt / steps); }
    for (const v of World.vehicles) v.update(dt);
    for (const t of World.trams) t.update(dt);
    for (const p of World.peds) {
      p.physics(dt);
      if (!p.vehicle) p.animate(dt);
      else if (p.mesh.visible && p !== P) { const v = p.vehicle; p.mesh.position.set(v.x - v.fx * 0.2, v.y + 0.35, v.z - v.fz * 0.2); p.mesh.rotation.y = v.a; p.legL.rotation.x = p.legR.rotation.x = -1.2; }
    }
    Combat.update(dt); Special.update(dt); Score.update(dt); WorldEvents.update(dt); Fires.update(dt); Props.update(dt); Pickups.update(dt, P);
    Police.update(dt); Emergency.update(dt); Missions.update(dt); Interact.update(dt); Phones.update(dt);
    EventBus.update();
    Population.update(dt); Swiss.update(dt);
    if (P.vehicle && !P.vehicle.alive) { const v = P.vehicle; exitVehicle(P); }
    if (Police.level > this.stats.maxWanted) this.stats.maxWanted = Police.level;
    // end states
    if (this.endT > 0) { this.endT -= dt; if (this.endT <= 0) { if (Score.lives <= 0) { this.endT = 0; GameOver.show(); Input.endFrame(); return; } this.respawn(); } }
    // autosave
    this.saveT -= dt; if (this.saveT <= 0) { this.saveT = 60; if (P.alive) this.saveGame(); }
    // world fx
    FX.update(dt); W.waterTex.offset.x = (GAME_TIME * 0.02) % 1; W.waterTex.offset.y = (GAME_TIME * 0.035) % 1;
    this.updateCamera(dt);
    Sky.update(dt, this.camTarget.x, this.camTarget.z); Weather.update(dt, this.camTarget.x, this.camTarget.z);
    Markers.update(dt);
    // audio
    let siren = 0; for (const v of World.vehicles) if (v.sirenOn) siren = Math.max(siren, 1 - dist(v.x, v.z, this.camTarget.x, this.camTarget.z) / 60);
    Sfx.update(dt, clamp(siren, 0, 1), P.vehicle ? P.vehicle.v : 0, !!P.vehicle && P.vehicle.alive);
    this.draw();
    HUD.update(dt);
    Input.endFrame();
    // auto quality
    this.qT = (this.qT || 0) + dt;
    if (DEBUG) this._qLock = true;
    if (this.qT > 4 && this.fpsAcc > 1 / 38 && this.quality > 0 && !this._qLock) { this.quality--; this.applyQuality(); this.qT = 0; this.fpsAcc = 1 / 60; HUD.toast('Grafik automatisch reduziert'); if (this.quality === 0) this._qLock = true; }
  },
  idleTitle(dt) {
    // slow flyover behind the title screen
    GAME_TIME += dt;
    const t = GAME_TIME * 0.05;
    this.camTarget = { x: 147 + Math.cos(t) * 70, z: 147 + Math.sin(t) * 70 };
    this.viewH = 46; this.updateCamera(0.016);
    Sky.update(dt * 0.2, this.camTarget.x, this.camTarget.z); FX.update(dt);
    W.waterTex.offset.x = (GAME_TIME * 0.02) % 1;
    this.draw();
  }
};

const Interact = {
  current: null,
  update(dt) {
    const P = Game.player; this.current = null; let label = '';

    if (P.vehicle) {
      const pp = Places.paint;
      if (dist(P.vehicle.x, P.vehicle.z, pp.x, pp.z) < 4.5 && P.vehicle.alive) {
        if (!this._paintCD) {
          this._paintCD = true;
          if (Police.level > 0) {
            if (Game.money >= 500) { Game.addMoney(-500); Police.setHeat(0); Police.reset(); P.vehicle.color = pick(VTYPES.kleinwagen.cols.concat(['#5a2a8a', '#2a8a5a', '#8a5a2a'])); P.vehicle.updateLook(); HUD.notify('NEU LACKIERT', 'CHF 500 · Fahndung gelöscht', 2.5, '#76d8c5'); Game.saveGame(); }
            else HUD.toast('Neu lackieren kostet CHF 500 – zu wenig Geld!');
          } else { P.vehicle.color = pick(['#5a2a8a', '#2a8a5a', '#8a5a2a', '#e74c3c', '#3498db', '#111']); P.vehicle.updateLook(); HUD.toast('Gratis-Politur, weil du so brav bist.'); }
        }
      } else this._paintCD = false;
      this.setPrompt(''); this.setBtn(P.vehicle.speed < 9 ? 'AUS&shy;STEIGEN' : '–');
      return;

const HUD = {
  _c: {},
  set(id, prop, val) { const k = id + prop; if (this._c[k] !== val) { this._c[k] = val; const el = $(id); if (prop === 'text') el.textContent = val; else if (prop === 'html') el.innerHTML = val; else if (prop === 'w') el.firstElementChild.style.width = val; else if (prop === 'cls') el.className = val; else if (prop === 'hide') el.classList.toggle('hidden', val); } },
  toastT: 0, notifyT: 0,
  toast(msg) { this.set('toast', 'text', msg); this.toastT = 3.2; },
  notify(big, small, dur = 2.5, col = '#fff') { $('notify').innerHTML = `<div class="big" style="color:${col}">${big}</div><div class="small">${small || ''}</div>`; this.notifyT = dur; },
  mission(html) { this.set('mission', 'html', html); },
  timer(t) { this.set('timer', 'text', t); },
  update(dt) {
    const P = Game.player; if (!P) return;
    this.set('money', 'text', fmtCHF(Game.money));
    this.set('score', 'html', `${fmtPts(Score.points)}${Score.mult > 1 ? `<i>x${Score.mult}</i>` : ''}${Score.happy > 0 ? '<i>2×</i>' : ''}<u>${'♥'.repeat(Math.max(0, Score.lives))}</u>`);
    this.set('health', 'w', clamp(P.hp, 0, 100) + '%'); this.set('armor', 'w', clamp(P.armor, 0, 100) + '%');
    const v = P.vehicle; this.set('vehwrap', 'hide', !v);
    if (v) { this.set('vehbar', 'w', Math.round(clamp(v.hp / v.maxHp, 0, 1) * 100) + '%'); this.set('vehname', 'text', v.T.name + (v.dstate === 'CRITICAL' ? ' · BRENNT!' : v.dstate === 'DAMAGED' ? ' · beschädigt' : '')); }
    const lv = Police.level; let st = ''; for (let i = 1; i <= 5; i++) st += `<span class="${i <= lv ? 'on' : ''}">★</span>`;
    this.set('stars', 'html', st); this.set('stars', 'cls', 'px' + (lv > 0 && !Police.seen ? ' flash' : ''));
    const W = WEAPONS[P.weapon]; const inv = P.inv[P.weapon];
    this.set('wname', 'text', W.name);
    this.set('wammo', 'text', W.melee ? '' : P.reloadT > 0 ? 'lädt…' : W.proj === 'grenade' ? `× ${inv.clip + inv.ammo}` : `${inv.clip} / ${inv.ammo}`);
    this.set('wicon', 'html', `<img src="${this.icon(P.weapon)}" style="width:48px;image-rendering:pixelated">`);
    this.set('clock', 'text', `${Sky.str()} · ${Weather.label()}`);
    if (this.toastT > 0) { this.toastT -= dt; if (this.toastT <= 0) this.set('toast', 'text', ''); }

// ---------------- Minimap ----------------
const MiniMap = {
  init() {
    const S = 2; // px per world unit /S
    const c = document.createElement('canvas'); const ext = 380; c.width = c.height = ext / S * 1; const g = c.getContext('2d');
    const o = 40; // world offset
    const X = x => (x + o) / S;
    g.fillStyle = '#3a4a35'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#2b6f9a'; g.fillRect(X(132), X(-60), 30 / S, 370 / S); g.fillRect(0, X(306), c.width, c.height);
    for (let bz = 0; bz < 7; bz++) for (let bx = 0; bx < 7; bx++) {
      const t = W.blockAt(bx, bz); if (t === 'R') continue; const r = W.blockRect(bx, bz);
      g.fillStyle = t === 'X' ? '#6a3a5a' : t === 'P' ? '#4f8a3c' : t === 'I' || t === 'L' ? '#7a5a4a' : t === 'K' ? '#6a8aa0' : t === 'A' || t === 'G' || t === 'N' ? '#8a6a5a' : '#7a7a80';
      g.fillRect(X(r.x0), X(r.z0), 30 / S, 30 / S);
    }
    g.fillStyle = '#c8c8c8';
    for (let i = 0; i < 8; i++) { g.fillRect(X(W.c(i) - 6), X(-6), 12 / S, 300 / S); g.fillRect(X(-6), X(W.c(i) - 6), 300 / S, 12 / S); }
    g.fillStyle = '#2b6f9a'; for (let j = 0; j < 7; j++) g.fillRect(X(132), X(W.c(j) + 6), 30 / S, 30 / S);
    this.img = c; this.S = S; this.o = o;
    this.ctx = $('minimap').getContext('2d');
  },
  draw() {
    const g = this.ctx, P = Game.player; const pp = playerPos();
    this._t = (this._t || 0) + 1; if (this._t % 2) return;
    const zoom = P.vehicle ? 0.8 : 1.1; // screen px per world unit
    g.save(); g.fillStyle = '#1b2030'; g.fillRect(0, 0, 128, 128);
    g.translate(64, 64); g.rotate(Math.PI / 4); g.scale(zoom, zoom);
    g.imageSmoothingEnabled = false;
    g.drawImage(this.img, -(pp.x + this.o), -(pp.z + this.o), this.img.width * this.S, this.img.height * this.S);
    const dot = (x, z, col, s = 3) => { g.fillStyle = col; g.fillRect(x - pp.x - s / 2 / zoom, z - pp.z - s / 2 / zoom, s / zoom, s / zoom); };
    for (const ph of Places.phones) if (!Game.missionsDone[ph.mission] && !Missions.active) dot(ph.x, ph.z, '#f6c700', 6);
    dot(Places.gunshop.x, Places.gunshop.z, '#ff7a3a', 5); dot(Places.pharmacy.x, Places.pharmacy.z, '#3ad17a', 5); dot(Places.paint.x, Places.paint.z, '#76d8c5', 5);
    const blink = Math.floor(GAME_TIME * 4) % 2;
    for (const v of World.vehicles) if (v.isPolice && v.alive && v.sirenOn) dot(v.x, v.z, blink ? '#3a7aff' : '#ff3a3a', 4);
    for (const p of World.peds) if ((p.kind === 'cop' || p.kind === 'swat') && p.alive && !p.vehicle && Police.level > 0) dot(p.x, p.z, '#7ab0ff', 3);
    if (Police.heli) dot(Police.heli.x, Police.heli.z, '#ffffff', 5);
    for (const p of World.peds) { if (!p.alive || p.vehicle) continue; if (p.demo) dot(p.x, p.z, '#ff9a3a', 3); else if (p.thug && p.hostile) dot(p.x, p.z, '#ff2a2a', 3); }
    if (Markers.target) { const t = Markers.target; const dx = t.x - pp.x, dz = t.z - pp.z, d = Math.hypot(dx, dz); const R = 58 / zoom; const k = d > R ? R / d : 1; dot(pp.x + dx * k, pp.z + dz * k, '#f6d66f', 7); }
    g.restore();
    // player arrow (screen-relative)
    const a = P.vehicle ? P.vehicle.a : P.dir; const w = this.screenAngle(a);
    g.save(); g.translate(64, 64); g.rotate(w); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(0, -6); g.lineTo(4, 4); g.lineTo(-4, 4); g.closePath(); g.fill(); g.restore();
  },
  screenAngle(a) { // world heading → screen rotation (0 = up)
    const fx = Math.sin(a), fz = Math.cos(a);
    const sx = fx * Math.SQRT1_2 - fz * Math.SQRT1_2, sy = -(-fx * Math.SQRT1_2 - fz * Math.SQRT1_2);
    return Math.atan2(sx, -sy) + 0;
  }
};

    if (chance(dt * 0.15)) { const d = dist(p.x, p.z, Game.camTarget.x, Game.camTarget.z); if (d < 30 && Sfx.ctx && Sfx.on) { const t = Sfx.ctx.currentTime; Sfx.tone(t, 0.7, 0.15 * Sfx.vol(d), 140, 95, 'sawtooth'); } }

  }
};

const HISCORE_KEY = 'swissMayhem.hiscores.v1';
const Score = {
  points: 0, combo: 0, comboT: 0, mult: 1, lives: 3, nextLife: 50000, happy: 0,
  reset(save) { this.points = save ? save.points || 0 : 0; this.lives = save ? (save.lives ?? 3) : 3; this.nextLife = save ? save.nextLife || 50000 : 50000; this.combo = 0; this.comboT = 0; this.mult = 1; this.happy = 0; },
  add(n, combo) {
    if (combo) { this.combo++; this.comboT = 3.5; this.mult = Math.min(8, 1 + Math.floor(this.combo / 3)); }
    const got = Math.round(n * (combo ? this.mult : 1) * (this.happy > 0 ? 2 : 1));
    this.points += got;
    if (this.points >= this.nextLife) { this.nextLife += 50000; this.lives = Math.min(9, this.lives + 1); Sfx.play('mission'); HUD.notify('EXTRALEBEN!', `${this.lives} Leben`, 2, '#76d8c5'); }
    return got;
  },
  update(dt) {
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) { if (this.mult >= 3) HUD.toast(`Chaos-Kombo vorbei: x${this.mult}`); this.combo = 0; this.mult = 1; } }
    if (this.happy > 0) this.happy -= dt;
    if (Police.level > 0 && Game.player.alive) { this._wt = (this._wt || 0) + dt; if (this._wt >= 1) { this._wt = 0; this.add(Police.level * 10); } }
  },
  list() { try { return JSON.parse(localStorage.getItem(HISCORE_KEY)) || []; } catch (e) { return []; } },
  enter(name, pts, extra) {
    const l = this.list(); const e = { name: (name || 'ANONYM').slice(0, 12), score: pts, date: new Date().toISOString().slice(0, 10), ...extra };
    l.push(e); l.sort((a, b) => b.score - a.score); const top = l.slice(0, 10);
    try { localStorage.setItem(HISCORE_KEY, JSON.stringify(top)); } catch (er) { }
    return { list: top, rank: top.indexOf(e) };
  },
  table(list, hi = -1) {
    if (!list.length) return '<div style="color:#888;text-align:center">Noch keine Einträge – sei die erste Legende von Zürich.</div>';
    return '<table style="width:100%;border-collapse:collapse;font-size:13px">' + list.map((e, i) => `<tr style="${i === hi ? 'color:#0b0712;background:#f6d66f' : ''}"><td style="padding:3px 6px">${i + 1}.</td><td>${esc(e.name)}</td><td style="text-align:right;padding-right:6px">${fmtPts(e.score)}</td><td style="text-align:right;color:${i === hi ? '#0b0712' : '#888'};font-size:11px">${e.date || ''}</td></tr>`).join('') + '</table>';
  }
};
const fmtPts = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const SIGN_CACHE = {};
function placardTex(text) {
  if (SIGN_CACHE[text]) return SIGN_CACHE[text];
  const t = canvasTex(64, 40, (g, w, h) => {
    g.fillStyle = '#f4efe5'; g.fillRect(0, 0, w, h); g.strokeStyle = '#171022'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
    g.fillStyle = pick(['#c0392b', '#171022', '#1e5bd6', '#2e8b3a']); g.textAlign = 'center'; g.textBaseline = 'middle';
    const words = text.split(' '); const lines = []; let cur = '';
    for (const wd of words) { if ((cur + ' ' + wd).trim().length > 9 && cur) { lines.push(cur); cur = wd; } else cur = (cur + ' ' + wd).trim(); }
    lines.push(cur);
    const fs = lines.length > 2 ? 9 : 11; g.font = `bold ${fs}px monospace`;
    lines.forEach((l, i) => g.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * (fs + 1), w - 6));
  }, false);
  return SIGN_CACHE[text] = t;
}

const Swiss = {
  demo: null, demoT: 50, thugT: 0, zone: '', zoneT: 0, lastHour: -1,
  reset() { if (this.demo) this.endDemo(true); this.demoT = 45; this.zone = ''; this.lastHour = Math.floor(Sky.tod); },
  inLang(x, z, pad = 0) { const L = Places.langstrasse; return x > L.x0 - pad && x < L.x1 + pad && z > L.z0 - pad && z < L.z1 + pad; },
  zoneName(x, z) {

    d.x = A.x; d.z = A.z;
    const n = randi(12, 16);
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / 4), col = i % 4;
      const p = spawnPed('civ', A.x + rand(-2, 2), A.z + rand(-2, 2)); p.demo = d; p.keep = true; p.ai = DemoAI; p.personality = chance(0.5) ? 'brave' : 'fearful';
      p.offL = (col - 1.5) * 1.6 + rand(-0.3, 0.3); p.offF = -2 - row * 1.7 + rand(-0.3, 0.3); p.r = 0.3;
      p.mesh.children[0].children[0].children.forEach(m => { if (m.geometry === PedGeo.torso || m.geometry === PedGeo.arm) m.material = matCol(pick(theme.shirts)); });
      if (i >= 2 && chance(0.65)) this.giveSign(p, pick(theme.signs));
      p.onDamage = (amt, from) => this.provoked(p, from);
      d.members.push(p);
    }
    // banner carried by the front row
    const bm = new THREE.Mesh(new THREE.PlaneGeometry(5.8, 1.5), new THREE.MeshBasicMaterial({ map: signTex(theme.banner, '#f4efe5', '#c0392b', 256, 48), side: THREE.DoubleSide }));
    World.scene.add(bm); d.banner = bm;
    for (let i = 0; i < 2; i++) { const c = spawnPed('cop', A.x, A.z); c.keep = true; c.ai = DemoAI; c.demo = d; c.offL = i ? 6.2 : -6.2; c.offF = -4; d.cops.push(c); }
    for (let i = 0; i < (theme.tractors || 0); i++) {
      const v = spawnVehicle('traktor', A.x, A.z, 0); v.mission = true; v.demo = d; v.offF = -10 - i * 5.5;
      const drv = spawnPed('civ', A.x, A.z); CivAI.init(drv); drv.keep = true; putInVehicle(drv, v, true); v.ai = DemoTractorAI; d.tractors.push(v);
    }
    this.placeAt(d, 0.01);
    HUD.toast(`${theme.name} unterwegs – Strassen blockiert!`);
  },
  giveSign(p, text) {
    const s = new THREE.Group();
    s.add(new THREE.Mesh(vbox(0.07, 1.5, 0.07, 0.75), matCol('#8a6a4a')));
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 0.8), new THREE.MeshLambertMaterial({ map: placardTex(text), side: THREE.DoubleSide }));
    pl.position.y = 1.7; s.add(pl);
    s.position.set(0.42, 1.35, 0.1); p.body.add(s); p.sign = s;
  },
  placeAt(d, dt) {
    const A = Roads.nodes[d.from], B = Roads.nodes[d.to];
    const L = dist(A.x, A.z, B.x, B.z); d.t = Math.min(L, d.t + dt * 1.15 * (d.wait ? 0 : 1));
    d.dx = (B.x - A.x) / L; d.dz = (B.z - A.z) / L;
    d.x = A.x + d.dx * d.t; d.z = A.z + d.dz * d.t;
    if (d.t >= L) {
      d.segs++;
      if (d.segs >= 5) { this.endDemo(false); return; }
      const opts = B.nb.filter(k => k !== d.from && !this.inLang(Roads.nodes[k].x, Roads.nodes[k].z, 6));
      d.from = d.to; d.to = opts.length ? pick(opts) : d.from; d.t = 0;
    }
  },
  updateDemo(dt) {
    const d = this.demo; d.age += dt;
    const alive = d.members.filter(p => p.alive && !p.removed && p.demo === d);
    if (d.state === 'march') {
      // wait for stragglers
      let lag = 0; for (const p of alive) lag += dist(p.x, p.z, p.tx || p.x, p.tz || p.z); lag /= Math.max(1, alive.length);
      d.wait = lag > 3.5;
      this.placeAt(d, dt); if (!this.demo) return;
      // banner in front
      const rx = -d.dz, rz = d.dx;
      d.banner.position.set(d.x + d.dx * -0.6, 1.9, d.z + d.dz * -0.6); d.banner.rotation.set(0, Math.atan2(-rz, rx), 0);
      d.banner.position.y = 1.9 + Math.sin(GAME_TIME * 4) * 0.05;
      // chanting
      d.chantT -= dt;
      if (d.chantT <= 0) {
        d.chantT = rand(3, 6); const cd = dist(d.x, d.z, Game.camTarget.x, Game.camTarget.z);
        if (cd < 45 && Sfx.ctx && Sfx.on) { const t = Sfx.ctx.currentTime, v = Sfx.vol(cd); for (let k = 0; k < 3; k++) { Sfx.noise(t + k * 0.42, 0.3, 0.12 * v, 900, 500, 'bandpass', 2); Sfx.tone(t + k * 0.42, 0.25, 0.04 * v, 220 + k * 30, 200, 'sawtooth'); } Sfx.tone(t + 1.4, 0.35, 0.06 * v, 2600, 2500, 'square'); }
        if (cd < 30) HUD.toast('„' + d.theme.banner.replace('!', '') + '!“');
      }
      if (alive.length < d.members.length * 0.4) this.disperse('scatter');
    }
    const pp = playerPos();
    if (d.state !== 'march') {
      d.endT = (d.endT || 0) + dt;
      if (d.endT > 25 || dist(d.x, d.z, pp.x, pp.z) > Game.viewR + 40) this.endDemo(true);
    } else if (dist(d.x, d.z, pp.x, pp.z) > Game.viewR + 90) this.endDemo(true);
  },
  provoked(p, from) {
    const d = p.demo; if (!d || d.state !== 'march' || from !== Game.player) return;
    this.disperse('angry');
  },
  disperse(mode) {
    const d = this.demo; if (!d || d.state !== 'march') return;
    d.state = mode; World.scene.remove(d.banner);
    const P = Game.player; let angry = 0;
    for (const p of d.members) {
      if (!p.alive || p.removed) continue;
      p.demo = null; p.keep = false; CivAI.init(p); p.ai = CivAI; p.r = 0.38;
      if (mode === 'angry' && p.personality === 'brave' && !P.vehicle) { p.setState('defensive'); p.target = P; p.demoAngry = true; angry++; }
      else CivAI.panic(p, P.x, P.z, 2);
    }
    for (const c of d.cops) if (c.alive && !c.removed) { c.keep = false; CopAI.init(c, null); c.mode = 'chase'; }
    for (const v of d.tractors) if (v.driver && v.driver.alive) { v.ai = TrafficAI; TrafficAI.init(v); Lane.start(v, Roads.nearest(v.x, v.z), d.to); v.panicT = 8; }
    HUD.toast(mode === 'angry' ? (angry ? 'Die Demo ist wütend – sie greifen an!' : 'Die Demo löst sich panisch auf!') : 'Die Demo löst sich auf!');
  },
  endDemo(force) {
    const d = this.demo; if (!d) return;
    if (d.state === 'march') World.scene.remove(d.banner);
    const pp = playerPos();
    for (const p of [...d.members, ...d.cops]) {
      if (p.removed) continue; p.keep = false;
      if (p.demo === d) { p.demo = null; if (p.kind === 'cop') { if (dist(p.x, p.z, pp.x, pp.z) > Game.viewR) removePed(p); else { p.ai = CivAI; CivAI.init(p); } } else { p.ai = CivAI; CivAI.init(p); p.r = 0.38; } }
    }
    for (const v of d.tractors) { v.mission = false; if (v.ai === DemoTractorAI) { v.ai = TrafficAI; TrafficAI.init(v); Lane.start(v, Roads.nearest(v.x, v.z), d.to); } }
    if (!force) HUD.toast(`Die ${d.theme.name} ist vorbei.`);
    this.demo = null;
  },
  bells(n) {
    if (!Sfx.ctx || !Sfx.on || !Game.running) return;
    const t = Sfx.ctx.currentTime;
    for (let i = 0; i < Math.min(n, 6); i++) { Sfx.tone(t + i * 1.1, 1.6, 0.07, 392, 390, 'sine'); Sfx.tone(t + i * 1.1, 1.2, 0.04, 784, 780, 'triangle'); Sfx.tone(t + i * 1.1, 0.9, 0.02, 1176, 1170, 'sine'); }
  }
};

const DemoAI = {
  update(p, dt) {
    const d = p.demo; if (!d || !p.alive) return;
    if (p.kind === 'cop' && Police.level > 0) { p.demo = null; p.keep = false; CopAI.init(p, null); return; }
    const rx = -d.dz, rz = d.dx;
    p.tx = d.x + d.dx * p.offF + rx * p.offL; p.tz = d.z + d.dz * p.offF + rz * p.offL;
    const dx = p.tx - p.x, dz = p.tz - p.z, dd = Math.hypot(dx, dz);
    p.steer(dx, dz, dd > 0.4 ? clamp(dd * 1.2, 0.9, 3.4) : 0, dt);
    if (dd < 0.6) p.dir += angDiff(p.dir, Math.atan2(d.dx, d.dz)) * dt * 4;
    // raise fists / signs while chanting
    if (p.kind !== 'cop') { const ph = Math.sin(GAME_TIME * 5 + p.id); if (!p.sign) { p.armL.rotation.x = ph > 0.3 ? -2.8 : p.armL.rotation.x; } else { p.sign.position.y = 1.35 + Math.max(0, ph) * 0.25; p.armR.rotation.x = -2.6; } }
  },
  onEvent(e) {
    const d = Swiss.demo; if (!d || d.state !== 'march') return;
    if ((e.type === 'GUNSHOT' || e.type === 'EXPLOSION' || e.type === 'VEHICLE_DESTROYED') && dist(e.x, e.z, d.x, d.z) < (e.type === 'GUNSHOT' ? 26 : 40)) Swiss.disperse('scatter');
  }
};
const DemoTractorAI = {
  update(v, dt) {
    const d = v.demo; if (!d || !v.alive || !v.driver) { v.throttle = 0; return; }
    const tx = d.x + d.dx * v.offF, tz = d.z + d.dz * v.offF;
    const dd = dist(v.x, v.z, tx, tz), ta = Math.atan2(tx - v.x, tz - v.z);
    v.steerIn = clamp(-angDiff(v.a, dd > 1.5 ? ta : Math.atan2(d.dx, d.dz)) * 2, -1, 1);
    const want = dd > 1.2 ? Math.min(4, dd) : 0;
    v.throttle = clamp((want - v.v) * 0.6, -1, 1); v.handbrake = want === 0;
    if (chance(dt * 0.15)) Sfx.play('horn', v.distToCam());
  }
};

if (/debug/.test(location.search)) window.__G = { Game, World, Police, Missions, Combat, Population, EventBus, Fires, Props, Emergency, Sky, Weather, Places, Roads, spawnVehicle, spawnPed, Input, Pickups, WEAPONS, Score, WorldEvents, GameOver, Special, Swiss };

EventBus.on('Demo', ['GUNSHOT', 'EXPLOSION', 'VEHICLE_DESTROYED'], e => DemoAI.onEvent(e));

})();
</script>
